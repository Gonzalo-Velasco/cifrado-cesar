<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cifrado-Cesar</title>
  <script>
    try {
      var t = localStorage.getItem("cesar-tema") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="fondo" id="fondo" hidden></div>

  <header class="cabecera">
    <div class="cab-in">
      <h1>
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v6M12 15v6M3 12h6M15 12h6"/></svg>
        Cifrado Cesar
      </h1>

      <button class="burger" id="burger" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu">
        <svg class="i-abrir" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        <svg class="i-cerrar" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>

      <nav class="nav" id="menu" aria-label="Menú principal">
        <button class="nav-btn" id="navCesar" type="button" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          Cesar
        </button>
        <button class="nav-btn" id="navRueda" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v6M12 15v6M3 12h6M15 12h6"/></svg>
          Ruleta
        </button>
        <button class="nav-btn" id="navHist" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          Historial
        </button>
        <button class="nav-btn" id="tema" type="button">
          <svg class="i-luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="i-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span class="t-luna">Modo oscuro</span><span class="t-sol">Modo claro</span>
        </button>
      </nav>
    </div>
    <aside class="rueda-box desplegable" id="panelRueda" hidden aria-label="Ruleta de cifrado">
      <svg id="rueda" viewBox="0 0 300 300" role="img" aria-label="Ruleta con el alfabeto original y el alfabeto desplazado"></svg>
      <p id="leyenda" class="leyenda"></p>
    </aside>

    <section class="panel desplegable" id="panelHist" hidden aria-label="Historial">
      <div class="cab">
        <h2>Historial</h2>
        <button class="btn sec" id="borrarHist" type="button">Borrar historial</button>
      </div>
      <p class="ayuda">Haz clic en una fila para volver a cargar esa operación.</p>
      <div id="historial"></div>
    </section>
  </header>

  <main class="layout sin-rueda" id="layout">
    <section class="panel" aria-label="Herramienta">
      <div class="modos" role="tablist">
        <button class="modo activo" data-modo="cifrar" role="tab">Cifrar</button>
        <button class="modo" data-modo="descifrar" role="tab">Descifrar</button>
        <button class="modo" data-modo="fuerza" role="tab">Fuerza bruta</button>
      </div>

      <label for="texto">Mensaje</label>
      <textarea id="texto" rows="5" placeholder="Escribe aquí el mensaje…"></textarea>
      <div class="fila">
        <label class="btn sec" for="archivo">Cargar .txt</label>
        <input id="archivo" type="file" accept=".txt,text/plain" hidden>
        <button class="btn sec" id="limpiar" type="button">Limpiar</button>
      </div>

      <label for="desp" id="lblDesp">Desplazamiento (1 a 25)</label>
      <div class="fila-accion">
        <input id="desp" type="number" min="1" max="25" value="3" inputmode="numeric">
        <button class="btn sec" id="azar" type="button">Clave al azar</button>
      </div>
      <p id="error" class="error" role="alert"></p>
      <div class="fila-centro">
        <button class="btn pri" id="ejecutar" type="button">Cifrar</button>
      </div>
    </section>

    <section class="panel ancho" id="resultado-box" hidden aria-live="polite">
      <h2>Resultado</h2>
      <div id="resultado"></div>
    </section>

  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="script.js"></script>
</body>
</html>
